.github/workflows/build.yml
name: build-portable

on:
  workflow_dispatch:          # 手动点按钮触发
  push:
    tags: ['v*']              # 打 v 开头的标签时触发（自动发 Release）

permissions:
  contents: write             # 允许用 GITHUB_TOKEN 创建 Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 缓存 Electron 二进制（加速二次构建）
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ hashFiles('setup-project.js') }}

      - name: 生成工程与补丁
        run: node setup-project.js

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 拷贝离线库
        run: node tools/copy-vendor.js

      - name: 打包便携版 exe
        run: npx electron-builder --win portable --publish never

      - name: 上传产物（Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: CPK-Portable
          path: release/*.exe
          retention-days: 36000          # 保留 3600 天，过期需重跑
